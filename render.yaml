# One-click deployment blueprint for Render (https://render.com).
#
# Render reads this file when you point it at this repository, so the service is
# created with the right Dockerfile, health check, disk and settings — no clicking
# through a form, and no risk of a forgotten environment variable.
#
# Deployment from a Git repository is required; see sitetrackerpro-app/DEPLOY-PUBLIC.md.

services:
  - type: web
    name: sitetrackerpro
    runtime: docker
    # "free" costs nothing and is enough to try the live site. It sleeps after 15
    # idle minutes (the next visit waits ~1 minute to wake it) and its filesystem is
    # rebuilt on every restart or deploy, so uploaded BIM/take-off files are lost.
    # For real use switch this one line to "starter" (~$7/month) and re-add the
    # disk block at the bottom of this file. Both changes are explained in
    # sitetrackerpro-app/DEPLOY-PUBLIC.md under "Moving off the free plan".
    plan: free
    region: frankfurt
    # The root Dockerfile builds from the repository root and copies from
    # sitetrackerpro-app/, so no dockerContext setting is needed. (A context
    # pointed at the app folder came through empty on Render and the build failed
    # with "COPY backend/ ... not found".)
    dockerfilePath: ./Dockerfile
    # Stated explicitly so a previously saved value cannot linger: the context is
    # the repository root, and the root Dockerfile copies from sitetrackerpro-app/.
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Signing key for logins. Render generates a 64-character value on the first
      # deploy and keeps it stable, so nobody is logged out by a redeploy.
      - key: JWT_SECRET
        generateValue: true
      # Paste the Neon connection string when Render asks for it.
      # Neon → Project → Connect → the "postgresql://…" string.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      # Where imports are written. The image creates this folder owned by the app
      # user, so uploads work on the free plan too — they just do not survive a
      # restart until the disk is mounted (see the note at the bottom).
      - key: UPLOAD_DIR
        value: /app/uploads

      # ---------- object storage (Supabase Storage, S3-compatible) ----------
      # These are declared here on purpose. Without them the app silently falls back to
      # UPLOAD_DIR, and on the free plan that disk is rebuilt on every deploy, so every
      # uploaded BIM model, take-off and GIS import disappears without an error.
      #
      # Only the bucket name is written down: it is public (GET /health reports it) and it
      # is what the app must use. Every credential is `sync: false`, which means "keep the
      # value from the dashboard" - no key ever reaches this repository, and a blueprint
      # sync does not delete the values you pasted into Render.
      #
      # If the bucket is ever renamed, change it here AND in the dashboard, or uploads fail.
      - key: S3_BUCKET
        value: sitetrackerprofinale
      # Supabase: Project Settings -> Storage -> S3 connection. Region is the project's.
      - key: S3_REGION
        sync: false
      # Supabase: https://<project-ref>.supabase.co/storage/v1/s3  (path-style is forced)
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Render terminates TLS one hop in front of the app.
      - key: TRUST_PROXY
        value: "1"
      # Public sign-up stays closed on the public site, exactly as it is locally.
      # Without this the live site accepts new accounts from anyone who finds it,
      # because .env is (correctly) not shipped inside the image.
      - key: DISABLE_REGISTRATION
        value: "1"
      # Hosted Site AI. Leave the key blank until you have created it at
      # https://z.ai/manage-apikey/apikey-list; the built-in Site AI still works.
      - key: ZAI_API_KEY
        sync: false
      - key: ZAI_API_BASE
        value: https://api.z.ai/api/paas/v4
      - key: ZAI_MODEL
        value: glm-4.7-flash
      - key: AI_RATE_LIMIT
        value: "30"

    # DISK — needed for "starter" and above, NOT allowed on the free plan.
    # To move to Starter: change `plan:` above to "starter" and uncomment these
    # four lines, then commit. Existing uploads start surviving deploys again.
    #
    # disk:
    #   name: uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1
